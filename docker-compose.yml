services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: comics
      POSTGRES_PASSWORD: comics
      POSTGRES_DB: comics
    volumes:
      - storyboard-pg:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comics -d comics"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://comics:comics@db:5432/comics
      STORYBOARD_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:4173:4173"
volumes:
  storyboard-pg:
