<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Раскадровка</title>
  <link rel="stylesheet" href="/viewer.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="page">
    <h1>Раскадровка</h1>
    <form id="draft-form" class="paste-form">
      <label for="draft">Черновик диалога</label>
      <textarea id="draft" name="draft"></textarea>
      <button type="submit">Показать раскадровку</button>
    </form>
    <p id="loading" class="loading" hidden>Сборка раскадровки…</p>
    <p id="notice" class="notice" hidden></p>
    <button id="open-last" type="button" hidden>Открыть последний кадр</button>
    <section id="storyboard" class="grid" aria-label="Кадры раскадровки"></section>
  </main>
  <dialog id="detail">
    <div class="detail-layout">
      <div id="detail-frame" class="frame-host"></div>
      <p id="detail-outside" class="outside-frame"></p>
    </div>
    <button id="close-detail" type="button">Закрыть</button>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
